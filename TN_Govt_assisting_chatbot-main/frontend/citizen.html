<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>நகர குறைதீர் · Nagar Kuraiteer</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#EFF3F1;--surface:#fff;--ink:#10312B;--teal:#0E5A4F;--tealSoft:#E7F0ED;
    --accent:#E8871E;--muted:#5C6B67;--line:#D8E2DE;--ok:#1E7A5E;--high:#C6472F;--user:#0E5A4F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Tamil',system-ui,sans-serif;
       display:flex;justify-content:center;padding:16px 12px;min-height:100vh}
  .app{width:100%;max-width:560px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;
        box-shadow:0 12px 40px -20px rgba(16,49,43,.35)}
  header{background:var(--teal);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
  header .logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px}
  header h1{font-family:'Anek Tamil';font-size:18px;margin:0;line-height:1.1}
  header .sub{font-size:12px;opacity:.85}
  .lang{margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.14);padding:3px;border-radius:20px}
  .lang button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px}
  .lang button.on{background:#fff;color:var(--teal);font-weight:600}
  .body{padding:18px 16px}
  h2{font-family:'Anek Tamil';font-size:17px;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13.5px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;
        font-family:inherit;font-size:15px;color:var(--ink);background:#fff}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;
       font-weight:600;font-family:'Anek Tamil';cursor:pointer;transition:filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.5;cursor:default}
  .btn.amber{background:var(--accent)} .btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--line)}
  .row{display:flex;gap:8px} .mt{margin-top:12px} .center{text-align:center}
  /* chat */
  #log{height:360px;overflow-y:auto;padding:6px 2px}
  .msg{display:flex;margin-bottom:11px} .msg.u{justify-content:flex-end}
  .bub{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
  .msg.b .bub{background:var(--tealSoft)} .msg.u .bub{background:var(--user);color:#fff}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .chip{font-size:12.5px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--teal);cursor:pointer}
  .chip:hover{background:var(--tealSoft)}
  .composer{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;margin:0 2px;animation:d 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes d{0%,60%,100%{opacity:.25}30%{opacity:1}}
  /* confirm + slip */
  .panel{border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:14px;padding:16px;margin-top:8px;background:#FBFDFC}
  label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
  .seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:8px;cursor:pointer;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .slip{border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:14px;padding:18px;margin-top:8px;background:#fff}
  .id{font-family:'Anek Tamil';font-weight:700;font-size:22px;letter-spacing:.5px}
  .pill{font-size:11px;padding:4px 9px;border-radius:20px;color:#fff}
  .tl{display:flex;margin-top:10px}.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--muted)}
  .tl .dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:#fff;margin:0 auto 6px}
  .tl .st.on .dot{background:var(--ok);border-color:var(--ok)} .tl .st.on{color:var(--ok)}
  .tl .st:not(:last-child):after{content:'';position:absolute;top:6px;left:50%;width:100%;height:2px;background:var(--line)}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  .link{color:var(--teal);cursor:pointer;text-decoration:underline;font-size:13px}
  .hidden{display:none}
  .warn{background:#FDF6EC;border:1px solid var(--accent);border-radius:12px;padding:14px;margin-top:8px;font-size:13.5px}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <header>
      <div class="logo">🏛️</div>
      <div>
        <h1 id="hTitle">நகர குறைதீர்</h1>
        <div class="sub" id="hSub">Coimbatore · Civic Grievance Assistant</div>
      </div>
      <div class="lang">
        <button id="lta" onclick="setLang('ta')">தமிழ்</button>
        <button id="len" onclick="setLang('en')">English</button>
      </div>
    </header>
    <div class="body">
      <!-- STEP: auth -->
      <div id="auth">
        <h2 data-t="verifyTitle"></h2>
        <p class="muted" data-t="verifySub"></p>
        <input id="phone" inputmode="numeric" placeholder="+91 " class="mt"/>
        <button class="btn mt" style="width:100%" onclick="requestOtp()" data-t="sendOtp"></button>
        <div id="otpBox" class="hidden">
          <input id="otp" class="mt" inputmode="numeric" placeholder="OTP"/>
          <div class="muted mt" id="otpHint"></div>
          <button class="btn mt" style="width:100%" onclick="verifyOtp()" data-t="verify"></button>
        </div>
        <p class="center mt"><span class="link" onclick="showTrack()" data-t="haveId"></span></p>
      </div>

      <!-- STEP: chat -->
      <div id="chat" class="hidden">
        <div id="log"></div>
        <div id="postChat"></div>
        <div id="composer" class="composer">
          <textarea id="inp" rows="1" data-tph="typeHere" style="max-height:120px"></textarea>
          <button class="btn" onclick="send()" data-t="sendBtn"></button>
        </div>
        <div class="foot" data-t="demoNote"></div>
      </div>

      <!-- STEP: track -->
      <div id="track" class="hidden">
        <h2 data-t="trackTitle"></h2>
        <input id="tid" class="mt" placeholder="TN-CBE-2026-...."/>
        <button class="btn mt" style="width:100%" onclick="doTrack()" data-t="trackBtn"></button>
        <div id="trackOut"></div>
        <p class="center mt"><span class="link" onclick="location.reload()" data-t="backHome"></span></p>
      </div>
    </div>
  </div>
</div>
<script>
const T = {
  en:{verifyTitle:"Verify Mobile Number",verifySub:"Please verify your mobile number to file a grievance and receive tracking updates via SMS.",
      sendOtp:"Request OTP",verify:"Verify OTP",haveId:"Track Existing Grievance",typeHere:"Describe the civic issue in your area...",
      sendBtn:"Submit",demoNote:"Official Civic Grievance Portal — Coimbatore City Municipal Corporation",trackTitle:"Track Grievance Status",
      trackBtn:"Track Status",backHome:"← Back to Home",review:"Review Grievance Details",cat:"Grievance Category",ward:"Area / Ward",
      landmark:"Landmark / Street (Optional)",desc:"Detailed Description",sev:"Priority / Severity Level",fileBtn:"Submit Grievance",
      shareLoc:"📍 Get My Location",need:"Grievance category, description, and location (Area/Ward or Landmark) are required.",
      low:"Routine",medium:"Priority",high:"Urgent",filedNew:"Grievance Successfully Registered",supportAdded:"Grievance Co-signed / Supported",
      type:"Category",dept:"Assigned Department",area:"Ward / Location",slaNote:"Grievance Registered. You will receive SMS updates. Targeted SLA date is shown above.",
      another:"Submit Another Grievance",reopen:"Reopen Grievance",rate:"Rate Resolution",thanks:"Thank you for your feedback.",
      dupTitle:"Grievance Already Exists",dupBody:"A similar grievance has already been registered in this ward",
      addSupport:"Support this Grievance",fileSep:"File Separately",status:"Status",notFound:"No grievance found with the specified Tracking ID.",
      otpHint:"Demo OTP: "},
  ta:{verifyTitle:"கைபேசி எண் சரிபார்ப்பு",verifySub:"தங்களின் புகாரைக் கண்காணிக்கவும், அதுகுறித்த புதிய தகவல்களை SMS மூலம் அனுப்பவும் மட்டுமே கைபேசி எண் பயன்படுத்தப்படும்.",
      sendOtp:"கடவுச்சொல் (OTP) அனுப்பு",verify:"சரிபார்க்கவும்",haveId:"மனு எண் மூலம் கண்காணிக்க",typeHere:"உங்கள் புகாரை இங்கே தட்டச்சு செய்யவும்...",
      sendBtn:"சமர்ப்பி",demoNote:"நகர குறைதீர் - கோவை மாநகராட்சி குடிமக்கள் குறைதீர்வு முகப்பு",trackTitle:"மனு நிலை அறிதல் (Track Grievance)",
      trackBtn:"நிலை அறிய",backHome:"← முகப்பு பக்கத்திற்கு செல்ல",review:"மனு விவரங்களைச் சரிபார்க்கவும்",cat:"புகார் வகை (Category)",ward:"பகுதி / வார்டு (Area / Ward)",
      landmark:"அடையாளம் / தெருப்பெயர் (Landmark / Street - Optional)",desc:"புகார் விவரம் (Description)",sev:"தீவிரம் (Severity)",fileBtn:"மனுவை சமர்ப்பிக்கவும்",
      shareLoc:"📍 என் இருப்பிடத்தைப் பயன்படுத்து",need:"புகார் வகை, விவரம் மற்றும் இடம் (பகுதி/வார்டு அல்லது அடையாளம்) ஆகியவை தேவை.",
      low:"சாதாரண நிலை",medium:"நடுத்தர நிலை",high:"உடனடி கவனம் தேவை",filedNew:"மனு வெற்றிகரமாக சமர்ப்பிக்கப்பட்டது",supportAdded:"மனு ஆதரவு பதிவு செய்யப்பட்டது",
      type:"புகார் வகை",dept:"துறை (Department)",area:"வட்டார பகுதி (Ward)",slaNote:"மனு எண் தங்களின் கைபேசி எண்ணிற்கு SMS செய்யப்பட்டுள்ளது. குறிப்பிட்ட கால அளவிற்குள் தீர்வு காணப்படும்.",
      another:"மற்றொரு மனுவைத் தாக்கல் செய்ய",reopen:"மனுவை மீண்டும் திறக்கவும் (தீர்வ திருப்தி தராத பட்சத்தில்)",rate:"மதிப்பீடு வழங்கவும்",thanks:"தங்களின் மேலான கருத்துகளுக்கு நன்றி.",
      dupTitle:"புகார் ஏற்கனவே பதிவாகியுள்ளது",dupBody:"இந்த பகுதியில் இதே போன்ற புகார் ஏற்கனவே பதிவாகி விசாரணையில் உள்ளது",
      addSupport:"நானும் இந்த புகாரை ஆதரிக்கிறேன்",fileSep:"புதிய புகாராகப் பதிவு செய்க",status:"மனுவின் தற்போதைய நிலை",notFound:"இந்த மனு எண்ணில் எந்த புகாரும் கண்டறியப்படவில்லை.",
      otpHint:"டெமோ OTP: "}
};
const CATS=[["streetlight","தெருவிளக்கு · Streetlight"],["garbage","குப்பை · Garbage"],["water_supply","குடிநீர் · Water"],
  ["drainage","வடிகால் · Drainage"],["sewage","சாக்கடை · Sewage"],["road","சாலை · Road"],["other","மற்றவை · Other"]];
const WARDS = [
  "Gandhipuram (Ward 42)",
  "R.S. Puram (Ward 55)",
  "Peelamedu (Ward 71)",
  "Saibaba Colony (Ward 49)",
  "Singanallur (Ward 89)",
  "Ukkadam (Ward 20)",
  "Thudiyalur (Wards 1, 2)",
  "Saravanampatti (Wards 3, 4)",
  "Keeranatham (Ward 4)",
  "Chinnavedampatti (Ward 27)",
  "Ganapathy (Wards 28, 29)",
  "Sivanandha Colony (Ward 40)",
  "Saibaba Colony (Wards 42, 43)",
  "R.S. Puram (Wards 46, 47)",
  "Town Hall (Ward 80)",
  "Ukkadam (Ward 81)",
  "Selvapuram (Ward 82)",
  "Race Course (Ward 83)",
  "Ramanathapuram (Ward 67)",
  "Singanallur (Wards 63, 64)",
  "Peelamedu (Wards 56, 57, 58)",
  "Hope College (Ward 58)",
  "Civil Aerodrome (Ward 59)",
  "Avinashi Road (East Stretch - Wards 60, 61, 62)",
  "Ondipudur (Ward 69)",
  "Podanur (Wards 92, 93)",
  "Sundarapuram (Ward 95)",
  "Kuniyamuthur (Wards 96, 97)",
  "Madukkarai (Ward 100)",
  "Other / Not Listed"
];

let lang="ta", phone="", sid="sess-"+Math.random().toString(36).slice(2), firstTurn=true;

function tr(k){return T[lang][k]}
let demoCode = "";
function updateOtpHint(){if(demoCode)document.getElementById('otpHint').textContent=tr('otpHint')+demoCode;}

function setLang(l){lang=l;document.getElementById('lta').classList.toggle('on',l==='ta');
  document.getElementById('len').classList.toggle('on',l==='en');
  document.getElementById('hSub').textContent = l==='ta'?"கோயம்புத்தூர் · குடிமக்கள் குறைதீர் உதவியாளர்":"Coimbatore · Civic Grievance Assistant";
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));
  document.querySelectorAll('[data-tph]').forEach(e=>e.placeholder=tr(e.dataset.tph));
  updateOtpHint();}
setLang('ta');

async function api(path,body,method="POST"){const o={method,headers:{'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);const r=await fetch(path,o);return r.json();}

// ---- auth ----
async function requestOtp(){phone=document.getElementById('phone').value.replace(/\D/g,'');if(phone.length<10)return;
  const r=await api('/api/v1/auth/request-otp',{phone});document.getElementById('otpBox').classList.remove('hidden');
  demoCode=r.demo_code;updateOtpHint();}
async function verifyOtp(){const code=document.getElementById('otp').value.trim();
  const r=await api('/api/v1/auth/verify-otp',{phone,code});if(!r.verified)return;
  document.getElementById('auth').classList.add('hidden');document.getElementById('chat').classList.remove('hidden');
  bot(tr('welcome')||({ta:"வணக்கம்! உங்கள் பகுதியில் உள்ள பிரச்சினையைச் சொல்லுங்கள்.",en:"Hello! Tell me the problem in your area."}[lang]));
  showChips();}
function showChips(){const c=document.createElement('div');c.className='chips';
  const ex=lang==='ta'?["தெருவிளக்கு எரியல","குப்பை அள்ளல","தண்ணி வரல","ரோட்ல பள்ளம்"]:["streetlight not working","garbage not collected","no water supply","pothole on road"];
  ex.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>{c.remove();send(s)};c.appendChild(b)});
  document.getElementById('postChat').appendChild(c);}

// ---- chat ----
function bot(t){add('b',t)} function usr(t){add('u',t)}
function add(who,t){const l=document.getElementById('log');const m=document.createElement('div');m.className='msg '+who;
  m.innerHTML='<div class="bub"></div>';m.querySelector('.bub').textContent=t;l.appendChild(m);l.scrollTop=l.scrollHeight;}
function typing(on){let e=document.getElementById('typing');if(on&&!e){e=document.createElement('div');e.id='typing';e.className='msg b';
  e.innerHTML='<div class="bub dots"><span></span><span></span><span></span></div>';document.getElementById('log').appendChild(e);}
  else if(!on&&e)e.remove();}
async function send(pre){const inp=document.getElementById('inp');const text=(pre??inp.value).trim();if(!text)return;
  const chips = document.querySelector('.chips');
  if(chips) chips.remove();
  inp.value='';usr(text);typing(true);
  const r=await api('/api/v1/intake/message',{session_id:sid,ui_language:lang,text});typing(false);
  bot(r.assistant_message);
  if(r.mode==='confirm')showConfirm(r.draft);}

// ---- confirm card ----
function showConfirm(d){document.getElementById('composer').classList.add('hidden');
  const p=document.getElementById('postChat');
  const sevBtns=['low','medium','high'].map(s=>`<button data-sev="${s}" class="${(d.severity||'medium')===s?'on':''}" onclick="pickSev(this)">${tr(s)}</button>`).join('');
  p.innerHTML=`<div class="panel">
    <h2>${tr('review')}</h2>
    <label>${tr('cat')}</label>
    <select id="fCat">${CATS.map(([k,l])=>`<option value="${k}" ${d.category===k?'selected':''}>${l}</option>`).join('')}</select>
    <label>${tr('ward')}</label>
    <div class="row"><select id="fWard" style="flex:1"><option value="">—</option>${WARDS.map(w=>`<option ${d.ward===w?'selected':''}>${w}</option>`).join('')}</select>
      <button class="btn ghost" onclick="useLoc()">${tr('shareLoc')}</button></div>
    <label>${tr('landmark')}</label><input id="fLm" value="${d.landmark||''}"/>
    <label>${tr('desc')}</label><textarea id="fDesc" rows="2">${d.description||''}</textarea>
    <label>${tr('sev')}</label><div class="seg" id="fSev">${sevBtns}</div>
    ${d.sensitivity==='sensitive'?`<div class="warn">🔒 ${lang==='ta'?'இது முக்கியமான புகார் — உயர் அதிகாரிக்கு அனுப்பப்படும்.':'Flagged sensitive — routed to a senior officer, kept confidential.'}</div>`:''}
    <button class="btn" style="width:100%;margin-top:14px" onclick="fileIt()">${tr('fileBtn')}</button>
  </div>`;
  p.querySelector('.panel').scrollIntoView({behavior:'smooth'});}
let sev=null;
function pickSev(b){sev=b.dataset.sev;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}

function useLoc(){document.getElementById('fWard').value=WARDS[Math.floor(Math.random()*WARDS.length)];}

async function fileIt(support, bypass){const cat=fCat.value,ward=fWard.value,desc=fDesc.value.trim(),landmark=fLm.value.trim();
  if(!cat||(!ward&&!landmark)||!desc){alert(tr('need'));return;}
  const body={session_id:sid,ui_language:lang,reporter_phone:phone,category:cat,ward,landmark,
    description:desc,severity:sev||'medium'};
  if(support)body.add_support_to=support;
  if(bypass)body.bypass_dedup=true;
  const r=await api('/api/v1/grievances',body);
  if(r.duplicate){showDup(r);return;}
  showSlip(r,support);}

function showDup(r){const p=document.getElementById('postChat');
  p.innerHTML=`<div class="warn"><b>${tr('dupTitle')}</b><br>${tr('dupBody')} (#${r.existing_id}).<br><br>
    <button class="btn" onclick="fileIt('${r.existing_id}')">${tr('addSupport')}</button>
    <button class="btn ghost" onclick="fileIt(null, true)">${tr('fileSep')}</button></div>`;}


function showSlip(r,support){document.getElementById('composer').classList.add('hidden');
  const sevC={low:'var(--muted)',medium:'var(--accent)',high:'var(--high)'}[r.severity];
  const steps=[['registered'],['assigned'],['in_progress'],['resolved']];
  const order=['registered','assigned','in_progress','resolved'];const cur=order.indexOf(r.status);
  const tl=order.map((s,i)=>`<div class="st ${i<=Math.max(cur,0)?'on':''}"><div class="dot"></div>${s.replace('_',' ')}</div>`).join('');
  document.getElementById('postChat').innerHTML=`<div class="slip">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><div class="muted" style="font-size:11px;letter-spacing:.4px">${support?tr('supportAdded'):tr('filedNew')}</div>
        <div class="id">${r.id}</div></div>
      <span class="pill" style="background:${sevC}">${tr(r.severity)}</span></div>
    <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:14px 0">
      <span class="muted">${tr('type')}</span><span>${r.category.ta} · ${r.category.en}</span>
      <span class="muted">${tr('dept')}</span><span>${r.dept}</span>
      <span class="muted">${tr('area')}</span><span>${r.ward||'—'}</span>
      ${r.reporter_count>1?`<span class="muted">👥</span><span>${r.reporter_count}</span>`:''}</div>
    <div class="tl">${tl}</div>
    <div class="foot">${tr('slaNote')}</div>
    <div class="row mt"><button class="btn ghost" style="flex:1" onclick="reopen('${r.id}')">${tr('reopen')}</button>
      <button class="btn amber" style="flex:1" onclick="rate('${r.id}')">${tr('rate')}</button></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="location.reload()">${tr('another')}</button></div>`;}
async function reopen(id){await api('/api/v1/grievances/'+id+'/reopen',{});alert(lang==='ta'?'மீண்டும் திறக்கப்பட்டது':'Reopened');}
async function rate(id){await api('/api/v1/grievances/'+id+'/feedback?rating=5','',"POST");alert(tr('thanks'));}

// ---- track ----
function showTrack(){document.getElementById('auth').classList.add('hidden');document.getElementById('track').classList.remove('hidden');}
async function doTrack(){const id=document.getElementById('tid').value.trim();const r=await api('/api/v1/grievances/'+id,null,"GET");
  const o=document.getElementById('trackOut');
  if(r.detail||!r.id){o.innerHTML=`<div class="warn">${tr('notFound')}</div>`;return;}
  o.innerHTML=`<div class="slip"><div class="id">${r.id}</div>
    <div style="margin:8px 0;font-size:14px">${tr('status')}: <b>${r.status}</b></div>
    <div class="muted">${r.category.en} · ${r.dept} · ${r.ward||''}</div></div>`;}
document.getElementById('inp')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
